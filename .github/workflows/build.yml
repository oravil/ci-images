# Builds the CI images. A pull request only builds and reports; a push to main (or a manual / monthly run) also publishes.
# Runs on GitHub's own runners: this repository is public and holds no secret, and the Oravil self-hosted runner stays credential-free.
name: build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # monthly: picks up PHP patch releases; consumers pin a digest, so nothing changes for them until they bump it

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/oravil/ci-php
      TAG: '8.4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: docker build --pull --build-arg PHP_VERSION="$TAG" -t "$IMAGE:$TAG" php

      - name: Report (PHP, Composer, extensions, ini)
        run: |
          {
            echo '### ci-php'
            echo '```'
            docker run --rm "$IMAGE:$TAG" bash -c 'php -v | head -1; composer --version; echo; echo "[modules]"; php -m | grep -v "^\[" | grep -v "^$" | sort -f | tr "\n" " "; echo; echo; echo "[ini]"; php -r "foreach ([\"memory_limit\",\"date.timezone\",\"opcache.enable\",\"opcache.enable_cli\",\"display_errors\",\"error_reporting\"] as \$k) echo \$k, \"=\", ini_get(\$k), PHP_EOL;"'
            echo '```'
            echo "Size: $(docker image inspect "$IMAGE:$TAG" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          DATED="$TAG-$(date -u +%Y%m%d)"
          docker tag "$IMAGE:$TAG" "$IMAGE:$DATED"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$DATED"
          DIGEST=$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}')
          { echo; echo "Published: \`$DIGEST\` (also tagged \`$DATED\`)"; echo "Pin this digest in the consumers' workflows."; } | tee -a "$GITHUB_STEP_SUMMARY"
